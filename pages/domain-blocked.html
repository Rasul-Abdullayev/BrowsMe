<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayta Giriş Məhdudlaşdırılıb</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
  <link rel="alternate icon" type="image/x-icon" href="../assets/icon.ico">
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font-main);
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1C2541 0%, #0B132B 85%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
    }

    .block-card {
      max-width: 680px;
      width: 100%;
      background: rgba(28, 37, 65, 0.7);
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(239, 68, 68, 0.2);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      backdrop-filter: blur(12px);
      animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid #EF4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
    }

    .warning-title {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
    }

    .warning-title span {
      color: #EF4444;
    }

    .target-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      padding: 12px 16px;
      background: rgba(11, 19, 43, 0.9);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-sm);
    }

    .domain-name {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: #EF4444;
    }

    .full-url {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #94A3B8;
      word-break: break-all;
    }

    .warning-desc {
      font-size: 14px;
      color: #E2E8F0;
      line-height: 1.6;
    }

    .btn-danger {
      padding: 12px 28px;
      background: #EF4444;
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }

    .btn-danger:hover {
      background: #DC2626;
      transform: translateY(-2px);
    }

    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="block-card">
    <div class="icon-wrapper" id="blockIcon">
      🚫
    </div>

    <div id="blockBadge" style="padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(239, 68, 68, 0.2); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.4);">
      Təhlükəsizlik Siyasəti
    </div>

    <h1 class="warning-title" id="warningTitle">Giriş Məhdudlaşdırılıb: <span>Qara Siyahı Xəbərdarlığı!</span></h1>

    <div class="target-box">
      <div class="domain-name" id="domainName">domain.com</div>
      <div class="full-url" id="fullUrl">https://domain.com/...</div>
    </div>

    <p class="warning-desc" id="warningDesc">
      Bu internet səhifəsi <strong>EduBrowser Təhsil və Diqqət Yayındırmayan Mühit Qaydaları</strong> çərçivəsində bloklanmışdır.
    </p>

    <div style="display: flex; gap: 12px;">
      <button class="btn-danger" id="goHomeBtn">
        ⌂ Təhlükəsiz Ana Səhifəyə Qayıt
      </button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const domain = params.get('domain') || 'Qadağan Edilmiş Domen';
    const target = params.get('target') || '';
    const reason = params.get('reason') || 'manual';

    const iconEl = document.getElementById('blockIcon');
    const badgeEl = document.getElementById('blockBadge');
    const titleEl = document.getElementById('warningTitle');
    const descEl = document.getElementById('warningDesc');
    const domainNameEl = document.getElementById('domainName');
    const fullUrlEl = document.getElementById('fullUrl');

    domainNameEl.textContent = '🚫 ' + domain;
    fullUrlEl.textContent = target;

    const keyword = params.get('keyword') || '';

    if (reason === 'search') {
      iconEl.textContent = '⛔';
      badgeEl.textContent = 'Qadağan Olunmuş Axtarış Sorğusu';
      badgeEl.style.background = 'rgba(239, 68, 68, 0.25)';
      badgeEl.style.borderColor = '#EF4444';
      titleEl.innerHTML = 'Axtarış Bloklandı: <span>Qadağan Olunmuş Məzmun</span>';
      descEl.innerHTML = `Daxil etdiyiniz axtarış sorğusunda EduBrowser tərəfindən qadağan olunmuş açar söz (<strong>"${keyword}"</strong>) aşkar edildi. Yetkinlik, pornoqrafiya və ya qumar/bəhs kateqoriyalarına aid axtarışlar təhsil mühitində qəti qadağandır.`;
    } else if (reason === 'porn') {
      iconEl.textContent = '🔞';
      badgeEl.textContent = 'Qadağan Olunmuş Məzmun';
      badgeEl.style.background = 'rgba(239, 68, 68, 0.25)';
      badgeEl.style.borderColor = '#EF4444';
      titleEl.innerHTML = 'Giriş Tam Qadağandır: <span>Yetkinlik / Pornografiya Məzmunu</span>';
      descEl.innerHTML = 'Bu veb-sayt <strong>Yetkinlik / Pornografiya</strong> kateqoriyasına aid olduğu üçün EduBrowser təhlükəsizlik siyasəti çərçivəsində birmənalı olaraq <strong>tam bloklanmışdır</strong>. Bu kateqoriyaya daxil olan heç bir sayta girişə icazə verilmir.';
    } else if (reason === 'social') {
      iconEl.textContent = '📱';
      badgeEl.textContent = 'Sosial Media Məhdudiyyəti (Qafqaz)';
      badgeEl.style.background = 'rgba(245, 158, 11, 0.2)';
      badgeEl.style.borderColor = '#F59E0B';
      badgeEl.style.color = '#F59E0B';
      titleEl.innerHTML = 'Sosial Şəbəkə Məhdudlaşdırılıb: <span>Qafqaz Region Siyasəti</span>';
      descEl.innerHTML = 'Qafqaz regionunda geniş yayılan bu sosial media platformasına (Instagram, TikTok, VK, OK və s.) giriş təhsil mühitinin qorunması məqsədilə qadağan edilmişdir. <strong>Yalnız Facebook (facebook.com) platformasına icazə verilir.</strong>';
    } else {
      iconEl.textContent = '⛔';
      badgeEl.textContent = 'Manual Qara Siyahı';
      titleEl.innerHTML = 'Sayta Giriş Məhdudlaşdırılıb: <span>Manual Qara Siyahı</span>';
      descEl.innerHTML = 'Bu internet səhifəsi ayarlar bölməsində istifadəçi və ya administrator tərəfindən <strong>əl ilə (manual) qara siyahıya</strong> əlavə edildiyi üçün bloklanmışdır.';
    }

    document.getElementById('goHomeBtn').addEventListener('click', () => {
      window.location.href = 'home.html';
    });
  </script>
</body>
</html>
